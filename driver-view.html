<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fleet Log — Live</title>
<link rel="manifest" href="manifest-driver.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#007aff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fleet Log">
<style>
  :root{
    --bg:#f2f2f7;
    --card:#ffffff;
    --card-2:#e9e9ee;
    --sep:#d1d1d6;
    --label:#000000;
    --secondary-label:#6e6e73;
    --tertiary-label:#a1a1a6;
    --blue:#007aff;
    --red:#ff3b30;
    --green:#34c759;
    --yellow:#ffcc00;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--label);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    padding-bottom:env(safe-area-inset-bottom, 24px);
    -webkit-font-smoothing:antialiased;
  }
  .scroller{max-width:600px; margin:0 auto; padding:0 16px;}
  .navbar{
    position:sticky; top:0; z-index:10;
    background:rgba(242,242,247,0.86);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    padding-top:env(safe-area-inset-top, 12px);
  }
  .navbar-inner{max-width:600px; margin:0 auto; padding:6px 16px 12px;}
  .eyebrow{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--secondary-label); font-weight:500; margin-bottom:2px;}
  .live-dot{width:7px; height:7px; border-radius:50%; background:var(--green); animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.35;}}
  h1{font-size:34px; font-weight:700; letter-spacing:-0.4px; margin:0;}

  .section-header{
    font-size:13px; font-weight:590; text-transform:uppercase; letter-spacing:0.2px;
    color:var(--secondary-label); padding:20px 16px 6px 20px;
  }
  .section-footer{font-size:13px; color:var(--secondary-label); padding:6px 20px 4px; line-height:1.35; text-align:center;}
  .group{background:var(--card); border-radius:12px; overflow:hidden;}

  .today-card{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 16px; border-bottom:0.5px solid var(--sep); gap:12px;
  }
  .today-card:last-child{border-bottom:none;}
  .plate-badge-lg{
    font-weight:700; font-size:19px; letter-spacing:0.5px; color:#000;
    background:var(--yellow); padding:8px 14px; border-radius:8px; white-space:nowrap;
  }
  .driver-name{font-size:22px; font-weight:600;}
  .driver-name.empty{color:var(--tertiary-label); font-size:17px; font-weight:400;}

  .history-row{display:flex; flex-direction:column; padding:12px 16px; border-bottom:0.5px solid var(--sep); gap:4px;}
  .history-row:last-child{border-bottom:none;}
  .history-top{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .history-meta{display:flex; flex-direction:column; gap:2px; min-width:0;}
  .history-date{font-size:13px; color:var(--secondary-label);}
  .history-main{display:flex; align-items:center; gap:8px; font-size:16px;}
  .plate-badge{font-weight:700; font-size:13px; letter-spacing:0.4px; color:#000; background:var(--yellow); padding:4px 8px; border-radius:6px; white-space:nowrap;}
  .fine-tag{font-size:12px; font-weight:590; padding:4px 9px; border-radius:8px; background:rgba(255,59,48,0.14); color:var(--red);}
  .fine-note{font-size:13px; color:var(--secondary-label); padding-left:2px;}

  .empty-state{padding:32px 16px; text-align:center; color:var(--secondary-label); font-size:15px; background:var(--card); border-radius:12px;}
  .loading{padding:24px 16px; text-align:center; color:var(--secondary-label); font-size:15px;}

  .field-row{display:flex; flex-direction:column; padding:12px 16px; gap:6px; border-bottom:0.5px solid var(--sep);}
  .field-row:last-child{border-bottom:none;}
  .field-label{font-size:13px; color:var(--secondary-label);}
  .text-input{
    width:100%; background:var(--card-2); border:none; color:var(--label);
    font-size:15px; font-family:inherit; padding:9px 10px; border-radius:8px;
  }
  .action-btn{
    width:100%; background:var(--blue); color:#fff; border:none; font-size:17px;
    font-weight:590; padding:14px; border-radius:12px; margin-top:16px; cursor:pointer;
  }
  .action-btn:active{opacity:0.7;}
  .banner{
    display:none; text-align:center; font-size:13px; color:var(--red);
    padding:8px 16px; margin-top:10px;
  }
  .banner.show{display:block;}
</style>
</head>
<body>
<div class="navbar">
  <div class="navbar-inner">
    <div class="eyebrow"><span class="live-dot" id="liveDot"></span><span id="lastSynced">Loading…</span></div>
    <h1>Fleet Log</h1>
  </div>
</div>

<div class="scroller">

  <div id="setupGroup" class="group" style="display:none; margin-top:16px;">
    <div class="field-row">
      <span class="field-label">GitHub repo (owner/repo) — must be Public</span>
      <input type="text" class="text-input" id="repoInput" placeholder="e.g. kumar-tan/fleet-log-data" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="field-row">
      <span class="field-label">Data file path</span>
      <input type="text" class="text-input" id="pathInput" placeholder="fleet-data.json" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="field-row">
      <button class="action-btn" id="connectBtn" style="margin-top:0;">View Live Log</button>
    </div>
  </div>
  <div class="banner" id="errorBanner"></div>

  <div id="mainContent" style="display:none;">
    <div class="section-header" id="todayHeader">Today</div>
    <div class="group" id="todayGroup"></div>

    <div class="section-header">Recent Log</div>
    <div class="group" id="historyGroup"><div class="loading">Loading…</div></div>
    <div class="section-footer">Updates automatically every 20 seconds. Pull down or reopen to refresh sooner.</div>
  </div>

</div>

<script>
const PLATES = ["GBH 218 Z","YR 1868 R","YR 1859 S","YR 2284 T"];
const CONFIG_KEY = "fleet-view-config";
const POLL_MS = 20000;
let data = { logs:{}, fines:{} };
let pollTimer = null;

function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function getConfig(){
  const params = new URLSearchParams(location.search);
  const fromUrl = { owner: params.get("owner"), repo: params.get("repo"), path: params.get("path"), branch: params.get("branch") };
  if(fromUrl.owner && fromUrl.repo){
    const cfg = {
      owner: fromUrl.owner,
      repo: fromUrl.repo,
      path: fromUrl.path || "fleet-data.json",
      branch: fromUrl.branch || "main"
    };
    localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
    return cfg;
  }
  try{
    const raw = localStorage.getItem(CONFIG_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function showBanner(msg){
  const b = document.getElementById("errorBanner");
  if(!msg){ b.classList.remove("show"); return; }
  b.textContent = msg;
  b.classList.add("show");
}

async function fetchData(cfg){
  const url = `https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch}/${cfg.path}?t=${Date.now()}`;
  const res = await fetch(url, { cache: "no-store" });
  if(res.status === 404) throw { notFound: true };
  if(!res.ok) throw new Error("fetch failed: " + res.status);
  const json = await res.json();
  return { logs: json.logs || {}, fines: json.fines || {} };
}

function fineKey(date, plate){ return date + "|" + plate; }

function renderToday(){
  const today = todayStr();
  const dayLog = data.logs[today] || {};
  document.getElementById("todayHeader").textContent = "Today — " + today;
  const group = document.getElementById("todayGroup");
  group.innerHTML = "";
  PLATES.forEach(plate=>{
    const driver = dayLog[plate];
    const row = document.createElement("div");
    row.className = "today-card";
    row.innerHTML = `
      <span class="plate-badge-lg">${plate}</span>
      <span class="driver-name ${driver ? "" : "empty"}">${driver || "Not assigned yet"}</span>
    `;
    group.appendChild(row);
  });
}

function renderHistory(){
  const rows = [];
  Object.keys(data.logs).sort().reverse().slice(0, 14).forEach(date=>{
    const dayLog = data.logs[date];
    PLATES.forEach(plate=>{
      const driver = dayLog[plate];
      if(!driver) return;
      const fk = fineKey(date, plate);
      const fine = data.fines[fk];
      rows.push({date, plate, driver, fined: !!fine, note: fine ? fine.note : ""});
    });
  });

  const group = document.getElementById("historyGroup");
  if(rows.length === 0){
    group.innerHTML = `<div class="empty-state">No entries yet.</div>`;
    return;
  }
  let html = "";
  rows.forEach(r=>{
    html += `<div class="history-row">
      <div class="history-top">
        <div class="history-meta">
          <span class="history-date">${r.date}</span>
          <span class="history-main"><span class="plate-badge">${r.plate}</span> ${r.driver}</span>
        </div>
        ${r.fined ? `<span class="fine-tag">Fine flagged</span>` : ""}
      </div>
      ${r.fined && r.note ? `<span class="fine-note">${r.note.replace(/</g,"&lt;")}</span>` : ""}
    </div>`;
  });
  group.innerHTML = html;
}

function setLastSynced(ok){
  const el = document.getElementById("lastSynced");
  const dot = document.getElementById("liveDot");
  const now = new Date();
  const time = now.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", second:"2-digit"});
  if(ok){
    el.textContent = "Live · updated " + time;
    dot.style.background = "var(--green)";
  }else{
    el.textContent = "Couldn't reach the log — retrying";
    dot.style.background = "var(--red)";
  }
}

async function refresh(cfg){
  try{
    data = await fetchData(cfg);
    setLastSynced(true);
    showBanner("");
    renderToday();
    renderHistory();
  }catch(e){
    console.error("Fleet Log live view: refresh failed", e);
    setLastSynced(false);
    if(e && e.notFound){
      showBanner("No data file found yet at that repo/path — ask the dispatcher to save a day first.");
    }else{
      showBanner("Can't reach GitHub right now — make sure the repo is Public, or check your connection.");
    }
  }
}

function startPolling(cfg){
  document.getElementById("setupGroup").style.display = "none";
  document.getElementById("mainContent").style.display = "block";
  refresh(cfg);
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(()=>refresh(cfg), POLL_MS);
}

document.getElementById("connectBtn").addEventListener("click", ()=>{
  const repoRaw = document.getElementById("repoInput").value.trim();
  const path = document.getElementById("pathInput").value.trim() || "fleet-data.json";
  const parts = repoRaw.split("/").map(p=>p.trim()).filter(Boolean);
  if(parts.length !== 2){
    showBanner("Enter the repo as owner/repo");
    return;
  }
  const cfg = { owner: parts[0], repo: parts[1], path, branch: "main" };
  localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
  startPolling(cfg);
});

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

/* ---------- install-to-home-screen banner ---------- */

let deferredInstallPrompt = null;
const INSTALL_DISMISSED_KEY = "fleet-view-install-dismissed";

function isStandaloneDisplay(){
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
}
function isIOSDevice(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}

function showInstallBanner(){
  if(isStandaloneDisplay()) return;
  if(localStorage.getItem(INSTALL_DISMISSED_KEY)) return;
  if(document.getElementById("installBanner")) return;

  const banner = document.createElement("div");
  banner.id = "installBanner";
  banner.style.cssText = "position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:45;background:#1c1c1e;color:#fff;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 24px rgba(0,0,0,0.35);max-width:568px;margin:0 auto;";

  if(isIOSDevice()){
    banner.innerHTML = `
      <div style="flex:1;font-size:13px;line-height:1.4;">Add this to your Home Screen — tap <strong>Share</strong> then <strong>Add to Home Screen</strong>.</div>
      <button id="dismissInstallBtn" style="background:none;border:none;color:#8e8e93;font-size:22px;line-height:1;padding:2px 4px;">&times;</button>
    `;
  }else{
    banner.innerHTML = `
      <div style="flex:1;font-size:14px;">Install this as an app for quicker access.</div>
      <button id="installNowBtn" style="background:#0a84ff;border:none;color:#fff;font-size:14px;font-weight:600;padding:8px 14px;border-radius:8px;white-space:nowrap;">Install</button>
      <button id="dismissInstallBtn" style="background:none;border:none;color:#8e8e93;font-size:22px;line-height:1;padding:2px 4px;">&times;</button>
    `;
  }
  document.body.appendChild(banner);

  document.getElementById("dismissInstallBtn").addEventListener("click", ()=>{
    banner.remove();
    localStorage.setItem(INSTALL_DISMISSED_KEY, "1");
  });

  const installBtn = document.getElementById("installNowBtn");
  if(installBtn){
    installBtn.addEventListener("click", async ()=>{
      if(!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      banner.remove();
    });
  }
}

window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  showInstallBanner();
});

if(isIOSDevice()){
  window.addEventListener("load", ()=> setTimeout(showInstallBanner, 1200));
}

(function init(){
  const cfg = getConfig();
  if(cfg && cfg.owner && cfg.repo){
    startPolling(cfg);
  }else{
    document.getElementById("setupGroup").style.display = "block";
  }
})();

document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible"){
    const cfg = getConfig();
    if(cfg && cfg.owner && cfg.repo) refresh(cfg);
  }
});
</script>
</body>
</html>
